name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        shell: bash
        run: |
          for project in $(find Tests Sources -name '*.Tests.csproj'); do
            dotnet test "$project" --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory "TestResults/$(basename "$project" .csproj)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
